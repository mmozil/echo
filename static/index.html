// === PDF.JS CLIENT-SIDE RENDERING ===
async function loadPdfDocument() {
    const pv = document.getElementById('pdfView');
    pv.innerHTML = '<div style="padding:40px;text-align:center"><div class="loading-spinner" style="margin:0 auto 12px"></div><p style="font-size:13px;color:var(--mist)">Carregando documento...</p></div>';

    // No mobile/touch: pular PDF.js (memória/perf) e usar PNG do servidor + SVG highlight
    const isMobile = window.matchMedia('(max-width: 640px)').matches || 'ontouchstart' in window;
    if (isMobile) { loadPdfPagesFallback(); attachPageClickHandlers(); return; }

    try {
        // Wait for pdfjsLib to be available
        let retries = 0;
        while (!window.pdfjsLib && retries < 50) { await new Promise(r => setTimeout(r, 100)); retries++; }
        if (!window.pdfjsLib) throw new Error('PDF.js nao carregou');

        const url = `/api/documents/${currentDoc.id}/pdf`;
        pdfDoc = await window.pdfjsLib.getDocument(url).promise;

        // Create page containers
        let html = '';
        for (let p = 1; p <= pdfDoc.numPages; p++) {
            html += `<div class="pdf-page" id="pdf-page-${p}" data-page="${p}"><canvas id="pdf-canvas-${p}"></canvas><svg class="pdf-hl-svg" preserveAspectRatio="none" viewBox="0 0 1000 1000"><path class="pdf-hl-hover" d=""/><path class="pdf-hl-sentence" d=""/><path class="pdf-hl-word" d=""/></svg></div><div class="pdf-page-num">Pagina ${p} de ${pdfDoc.numPages}</div>`;
        }
        pv.innerHTML = html;

        // Setup IntersectionObserver for lazy rendering
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const page = parseInt(entry.target.dataset.page);
                    renderPdfPage(page);
                }
            });
        }, { root: pv, rootMargin: '200px' });

        for (let p = 1; p <= pdfDoc.numPages; p++) {
            const el = document.getElementById(`pdf-page-${p}`);
            if (el) observer.observe(el);
        }

        // Render first visible pages immediately
        const chunk = currentChunks[currentChunkIndex];
        const startPage = chunk ? chunk.page : 1;
        for (let p = Math.max(1, startPage - 1); p <= Math.min(pdfDoc.numPages, startPage + 2); p++) {
            renderPdfPage(p);
        }

        // Scroll to current position
        if (startPage > 1) {
            setTimeout(() => {
                const el = document.getElementById(`pdf-page-${startPage}`);
                if (el) el.scrollIntoView({ behavior: 'auto' });
            }, 100);
        }

        // Pre-load word positions for nearby pages
        for (let p = Math.max(1, startPage - 1); p <= Math.min(currentDoc.total_pages, startPage + 3); p++) {
            loadPageWords(p);
        }

    } catch(e) {
        // Fallback to server-side rendering
        console.warn('PDF.js falhou, usando fallback server-side:', e);
        loadPdfPagesFallback();
    }
}

async function renderPdfPage(pageNum) {
    if (renderedPages[pageNum]) return;
    renderedPages[pageNum] = true;

    try {
        const page = await pdfDoc.getPage(pageNum);
        const canvas = document.getElementById(`pdf-canvas-${pageNum}`);
        if (!canvas) return;

        // Pixel-perfect: escala exata para 1:1 com pixels fisicos da tela
        const dpr = window.devicePixelRatio || 1;
        const pageEl = document.getElementById(`pdf-page-${pageNum}`);
        const displayWidth = pageEl.clientWidth || 700;
        const naturalViewport = page.getViewport({ scale: 1 });
        const scale = (displayWidth * dpr) / naturalViewport.width;
        const viewport = page.getViewport({ scale });

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        const ctx = canvas.getContext('2d');

        await page.render({ canvasContext: ctx, viewport }).promise;

        // TEXT LAYER: spans invisiveis sobre o canvas (como Speechify/PSPDFKit)
        if (!pageEl) return;

        const textContent = await page.getTextContent();
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'pdf-text-layer';

        // Escala do canvas para o elemento na tela
        const canvasDisplayWidth = canvas.clientWidth || canvas.offsetWidth;
        const displayScale = canvasDisplayWidth / viewport.width;

        for (const item of textContent.items) {
            if (!item.str || !item.str.trim()) continue;

            // item.transform = [scaleX, skewY, skewX, scaleY, translateX, translateY]
            const tx = window.pdfjsLib.Util.transform(viewport.transform, item.transform);
            const fontSize = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]);
            const left = tx[4];
            const top = tx[5] - fontSize; // PDF y e a baseline, subir pelo fontSize

            const span = document.createElement('span');
            span.textContent = item.str;
            span.dataset.text = item.str;
            span.dataset.page = pageNum;
            // Posicionar em % para ser responsivo
            span.style.left = (left / viewport.width * 100) + '%';
            span.style.top = (top / viewport.height * 100) + '%';
            span.style.fontSize = (fontSize / viewport.height * 100) + 'vh';
            // Usar transform para escala horizontal
            const scaleX = item.width ? (item.width * viewport.scale / (fontSize * item.str.length * 0.6)) : 1;
            span.style.transform = `scaleX(${Math.min(scaleX, 2).toFixed(2)})`;
            span.style.transformOrigin = '0 0';

            textLayerDiv.appendChild(span);
        }

        pageEl.appendChild(textLayerDiv);

        // Click handler na text layer: clicar num span = tocar a partir desse texto
        textLayerDiv.addEventListener('click', (e) => {
            const span = e.target.closest('span');
            if (!span || !span.dataset.text) return;
            handleTextLayerClick(pageNum, span, textLayerDiv);
        });

        // Hover SVG (estilo Speechify): pinta a frase inteira em cinza
        textLayerDiv.addEventListener('mousemove', (e) => {
            const span = e.target.closest('span');
            if (!span || !span.dataset.text) { clearHoverHighlight(pageNum); return; }
            paintHoverSentence(pageNum, span, textLayerDiv);
        });
        textLayerDiv.addEventListener('mouseleave', () => clearHoverHighlight(pageNum));

    } catch(e) {
        console.warn(`Erro ao renderizar pagina ${pageNum}:`, e);
        renderedPages[pageNum] = false;
    }
}

// Fallback: server-side rendering (caso PDF.js falhe)
function loadPdfPagesFallback() {
    const pv = document.getElementById('pdfView');
    if (!currentDoc) return;
    let html = '';
    for (let p = 1; p <= currentDoc.total_pages; p++) {
        html += `<div class="pdf-page" id="pdf-page-${p}" data-page="${p}"><img src="/api/documents/${currentDoc.id}/pages/${p}.png" alt="Pagina ${p}" loading="lazy" style="width:100%;display:block;border-radius:4px;pointer-events:none"><svg class="pdf-hl-svg" preserveAspectRatio="none" viewBox="0 0 1000 1000"><path class="pdf-hl-hover" d=""/><path class="pdf-hl-sentence" d=""/><path class="pdf-hl-word" d=""/></svg></div><div class="pdf-page-num">Pagina ${p} de ${currentDoc.total_pages}</div>`;
    }
    pv.innerHTML = html;
    for (let p = 1; p <= currentDoc.total_pages; p++) {
        // Text layer click-to-read e configurado dentro de renderPdfPage()
    }
    const chunk = currentChunks[currentChunkIndex];
    if (chunk && chunk.page > 1) {
        setTimeout(() => { const el = document.getElementById(`pdf-page-${chunk.page}`); if (el) el.scrollIntoView({ behavior: 'auto' }); }, 100);
    }
}

// Track page from scroll position
function updateCurrentPageFromScroll() {
    const pv = document.getElementById('pdfView');
    const pages = pv.querySelectorAll('.pdf-page');
    const scrollTop = pv.scrollTop + pv.clientHeight / 3;
    let currentPage = 1;
    for (const page of pages) {
        if (page.offsetTop <= scrollTop) {
            currentPage = parseInt(page.dataset.page);
        } else break;
    }
    document.getElementById('pageInput').value = currentPage;
}

function goToPageInput(val) {
    const page = parseInt(val);
    if (page >= 1 && page <= (currentDoc?.total_pages || 0)) {
        scrollPdfToPage(page);
    }
}
window.goToPageInput = goToPageInput;

function closeReader() {
    history.replaceState(null, '', window.location.pathname);
    closeReaderInternal();
}

function closeReaderInternal() {
    stopAudio();
    pdfDoc = null; renderedPages = {};
    document.getElementById('reader').classList.remove('active');
    document.getElementById('libraryView').classList.remove('hidden');
    document.querySelector('.header').style.display = 'flex';
    document.getElementById('searchBar').classList.remove('active');
    loadDocuments();
}

function scrollPdfToPage(page) {
    const el = document.getElementById(`pdf-page-${page}`);
    if (el) { programmaticScroll=true; el.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>{programmaticScroll=false;},1000); }
}

function setView(v) {
    currentView = v;
    document.getElementById('togglePdf').classList.toggle('active', v==='pdf');
    document.getElementById('toggleText').classList.toggle('active', v==='text');
    document.getElementById('pdfView').classList.toggle('hidden', v!=='pdf');
    document.getElementById('textView').classList.toggle('hidden', v!=='text');
}

// === SCROLL TO LISTENING ===
function scrollToCurrentReading() {
    userScrolling = false;
    if (currentView === 'pdf' && currentChunks[currentChunkIndex]) {
        scrollPdfToPage(currentChunks[currentChunkIndex].page);
    } else if (currentView === 'text') {
        const active = document.querySelector('#textView .word.active');
        if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    document.getElementById('scrollToListening').classList.remove('visible');
}
window.scrollToCurrentReading = scrollToCurrentReading;

function showScrollToListening() {
    if (isPlaying && userScrolling) {
        document.getElementById('scrollToListening').classList.add('visible');
    } else {
        document.getElementById('scrollToListening').classList.remove('visible');
    }
}

// === AUDIO ===
async function togglePlay() { if(isPlaying) pauseAudio(); else await playCurrentChunk(); }

async function playCurrentChunk(fracaoInicial = 0) {
    if (!currentDoc) return;
    stopHighlightLoop();
    lastPdfHighlightIdx = -1; // Reset highlight tracking
    // Limpar SVG highlights de TODAS as páginas (transição entre chunks/páginas)
    document.querySelectorAll('.pdf-hl-svg path').forEach(p => p.setAttribute('d', ''));
    showPlayLoading(true);
    try {
        let data;
        if (prefetchCache[currentChunkIndex]) { data = prefetchCache[currentChunkIndex]; delete prefetchCache[currentChunkIndex]; }
        else { const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${currentChunkIndex}/audio?voice=${encodeURIComponent(selectedVoice)}`,{method:'POST'}); data = await r.json(); if(!data.audio_url) throw new Error(data.detail||'Erro'); }

        wordBoundaries = data.boundaries || [];
        _sentenceRanges = [];
        if (data.text) renderTextWithWords(data.text);
        // Esperar DOM atualizar antes de construir boundary map
        await new Promise(r => requestAnimationFrame(r));
        buildBoundaryMap();

        // Pre-load word positions ANTES do play (para highlight funcionar imediatamente)
        const chunk = currentChunks[currentChunkIndex];
        if (chunk) await loadPageWords(chunk.page);

        audio.src = data.audio_url;
        audio.playbackRate = currentSpeed;
        if (fracaoInicial > 0) {
            // A voz nova tem duração própria — retomar pela fração do trecho é
            // o mais perto do ponto onde a pessoa estava.
            await new Promise(r => {
                if (audio.readyState >= 1) return r();
                audio.addEventListener('loadedmetadata', r, { once: true });
                setTimeout(r, 3000);
            });
            if (audio.duration) audio.currentTime = fracaoInicial * audio.duration;
        }
        await audio.play();
        isPlaying = true;
        showPlayLoading(false);
        updatePlayButton();
        startHighlightLoop();
        updateChapterDisplay();
        resetPlayerIdle();

        // Prefetch next chunks (5 ahead) e word positions das paginas seguintes
        prefetchAhead(currentChunkIndex);
        if (chunk) {
            for (let p = chunk.page; p <= Math.min(chunk.page + 3, currentDoc.total_pages); p++) {
                loadPageWords(p);
            }
        }

        fetch(`/api/documents/${currentDoc.id}/progress?current_chunk=${currentChunkIndex}`,{method:'PUT'});
    } catch(e) { showPlayLoading(false); showToast(e.message); }
}

// Prefetch 5 chunks ahead
function prefetchAhead(fromIdx) {
    for (let i = fromIdx + 1; i <= Math.min(fromIdx + 5, currentChunks.length - 1); i++) {
        if (!prefetchCache[i]) {
            fetch(`/api/documents/${currentDoc.id}/chunks/${i}/audio?voice=${encodeURIComponent(selectedVoice)}`,{method:'POST'}).then(r=>r.json()).then(d=>{if(d.audio_url) prefetchCache[i]=d;}).catch(()=>{});
        }
    }
}

function pauseAudio() { audio.pause(); isPlaying=false; updatePlayButton(); stopHighlightLoop(); resetPlayerIdle(); }
function stopAudio() { audio.pause(); audio.src=''; isPlaying=false; updatePlayButton(); stopHighlightLoop(); wordBoundaries=[]; prefetchCache={}; resetPlayerIdle(); }

const PP_ICONE_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8 5 20 12 8 19 8 5"/></svg>';
const PP_ICONE_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';

function updatePlayButton() {
    document.getElementById('playIcon').style.display = isPlaying?'none':'block';
    document.getElementById('pauseIcon').style.display = isPlaying?'block':'none';
    // O botão recolhido é o MESMO controle: tem de mostrar o mesmo estado
    const mini = document.getElementById('ppMiniIcon');
    if (mini) mini.innerHTML = isPlaying ? PP_ICONE_PAUSE : PP_ICONE_PLAY;
}
function showPlayLoading(on) {
    const b = document.getElementById('playBtn');
    if (on) {
        b.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite"></div>';
    } else {
        b.innerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" style="display:${isPlaying ? 'none' : 'block'}"><polygon points="8 5 20 12 8 19 8 5"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:${isPlaying ? 'block' : 'none'}"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>`;
    }
}

// === HIGHLIGHT ===
function startHighlightLoop() { stopHighlightLoop(); highlightInterval = setInterval(updateHighlight, 50); }
function stopHighlightLoop() { if(highlightInterval){clearInterval(highlightInterval);highlightInterval=null;} }

audio.addEventListener('playing', () => { if(!highlightInterval && wordBoundaries.length && boundaryToWordMap.length) startHighlightLoop(); });

function buildBoundaryMap() {
    boundaryToWordMap = [];
    const words = document.querySelectorAll('#textView .word');
    let di = 0;
    for (let bi=0; bi<wordBoundaries.length; bi++) {
        const bt = wordBoundaries[bi].text.toLowerCase().replace(/[.,;:!?"'()\[\]]/g,'');
        let found = false;
        for (let d=di; d<words.length && d<di+15; d++) {
            const wt = words[d].textContent.toLowerCase().replace(/[.,;:!?"'()\[\]]/g,'');
            if (wt===bt || wt.startsWith(bt) || bt.startsWith(wt)) { boundaryToWordMap.push(d); di=d+1; found=true; break; }
        }
        if (!found) boundaryToWordMap.push(-1);
    }
}

// Cache de limites de frase (recalculado quando o texto muda)
let _sentenceRanges = [];
function buildSentenceRanges(words) {
    _sentenceRanges = [];
    let start = 0;
    for (let i = 0; i < words.length; i++) {
        const t = words[i].textContent.trim();
        if (/[.!?;:]$/.test(t) || i === words.length - 1) {
            _sentenceRanges.push([start, i]);
            start = i + 1;
        }
    }
}

function updateHighlight() {
    if (!wordBoundaries.length) return;

    // Show/hide scroll-to-listening
    showScrollToListening();

    if (!settings.highlight) return;

    const ms = audio.currentTime * 1000;
    const words = document.querySelectorAll('#textView .word');
    let abi = -1;
    for (let i = 0; i < wordBoundaries.length; i++) { const b = wordBoundaries[i]; if (ms >= b.offset_ms && ms < b.offset_ms + b.duration_ms + 300) abi = i; }
    const awi = abi >= 0 ? boundaryToWordMap[abi] : -1;

    // Encontrar a frase que contem a palavra ativa
    let sentStart = -1, sentEnd = -1;
    for (const [s, e] of _sentenceRanges) {
        if (awi >= s && awi <= e) { sentStart = s; sentEnd = e; break; }
    }

    // Highlight: frase inteira = active-sentence, ja faladas = spoken
    words.forEach((w, i) => {
        w.classList.toggle('active-sentence', i >= sentStart && i <= sentEnd && sentStart >= 0);
        w.classList.toggle('spoken', i < sentStart && sentStart >= 0);
    });

    // Auto-scroll text view
    if (awi >= 0 && words[awi] && currentView === 'text' && !userScrolling) {
        const tv = document.getElementById('textView');
        const wt = words[awi].offsetTop - tv.offsetTop;
        const ts = tv.scrollTop, th = tv.clientHeight;
        if (wt < ts + 60 || wt > ts + th - 80) tv.scrollTo({ top: wt - th / 3, behavior: 'smooth' });
    }

    // PDF view: scroll to page
    if (currentView==='pdf' && currentChunks[currentChunkIndex] && !userScrolling) {
        scrollPdfToPage(currentChunks[currentChunkIndex].page);
    }

    // PDF highlight
    updatePdfHighlight();
}

function renderTextWithWords(text) {
    const tv = document.getElementById('textView');
    const paras = text.split('\n\n').filter(p=>p.trim());
    let wi=0, html='';
    for (const p of paras) {
        html += '<p>';
        const tks = p.split(/(\s+)/);
        for (const t of tks) { if(t.trim()) { html+=`<span class="word" data-idx="${wi}" onclick="seekToWord(${wi})">${t}</span>`; wi++; } else html+=t; }
        html += '</p>';
    }
    tv.innerHTML = html;
    // Buildar cache de frases imediatamente com os spans criados
    _sentenceRanges = [];
    buildSentenceRanges(tv.querySelectorAll('.word'));
}

async function loadChunkText(index) {
    try {
        const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${index}/text`);
        const d = await r.json();
        renderTextWithWords(d.text);
    } catch {}
}

async function seekToWord(wi) {
    let best=-1, bestD=Infinity;
    for(let bi=0;bi<boundaryToWordMap.length;bi++){const d=Math.abs(boundaryToWordMap[bi]-wi);if(d<bestD){bestD=d;best=bi;}}
    if(best>=0&&wordBoundaries[best]){
        // Esperar audio estar pronto se necessario
        if (audio.readyState < 2 && audio.src) await waitForAudioReady();
        audio.currentTime=wordBoundaries[best].offset_ms/1000;
        if(!isPlaying){await audio.play();isPlaying=true;updatePlayButton();startHighlightLoop();resetPlayerIdle();}
    }
}

audio.addEventListener('loadedmetadata', () => {
    if (audio.duration && isFinite(audio.duration)) {
        chunkDurations[currentChunkIndex] = audio.duration * 1000;
    }
});

function refreshPlayerTime() {
    // Cachear duração real se disponível
    if (audio.duration && isFinite(audio.duration)) {
        chunkDurations[currentChunkIndex] = audio.duration * 1000;
    }
    // Enquanto a pessoa arrasta, a trilha mostra o alvo dela — não o áudio.
    if (arrastandoTrilha) return;
    const curMs = getDocCurrentMs();
    const totMs = getDocTotalMs();
    const pct = totMs > 0 ? (curMs / totMs * 100) : 0;
    pintarTrilha(pct / 100, curMs, totMs);
    // Page info
    const chunk = currentChunks[currentChunkIndex];
    const pageInfo = document.getElementById('ppPageInfo');
    if (pageInfo && chunk) pageInfo.textContent = `pág ${chunk.page}/${currentDoc?.total_pages || '—'}`;
}

audio.addEventListener('timeupdate', refreshPlayerTime);

audio.addEventListener('ended', async () => {
    stopHighlightLoop();
    // Limpar SVG highlights do chunk anterior antes de avançar
    document.querySelectorAll('.pdf-hl-svg path').forEach(p => p.setAttribute('d', ''));
    lastPdfHighlightIdx = -1;
    if (currentChunkIndex < currentChunks.length - 1) {
        currentChunkIndex++;
        isPlaying = true; // garantir intenção de continuar tocando
        updateUI();
        try {
            await playCurrentChunk();
        } catch (e) {
            console.error('[echo] auto-advance falhou:', e);
            isPlaying = false; updatePlayButton();
            showToast('Toque play para continuar');
        }
    } else {
        isPlaying = false; updatePlayButton();
        showToast('Leitura concluída!');
        resetPlayerIdle();
    }
});

// === TRILHA DE PROGRESSO ===
// Num livro de 7 horas a trilha é o controle mais usado: precisa ser vista,
// clicada e ARRASTADA. Por isso ela tem faixa de toque de 20px, knob visível
// e os tempos nas pontas (decorrido à esquerda, restante à direita).
let arrastandoTrilha = false;

const PP_ANEL = 2 * Math.PI * 25; // circunferência do anel do botão recolhido

function pintarTrilha(frac, curMs, totMs) {
    frac = Math.max(0, Math.min(1, frac || 0));
    const pFill = document.getElementById('pFill');
    const pBar = document.getElementById('pBar');
    const curEl = document.getElementById('curTime');
    const totEl = document.getElementById('totTime');
    const anel = document.getElementById('ppRing');
    if (pFill) pFill.style.width = (frac * 100) + '%';
    if (pBar) pBar.setAttribute('aria-valuenow', Math.round(frac * 100));
    // O mesmo progresso, em anel, para o estado recolhido
    if (anel) anel.setAttribute('stroke-dashoffset', (PP_ANEL * (1 - frac)).toFixed(2));
    // Tempos divididos pela VELOCIDADE — refletem tempo real de escuta
    const speed = currentSpeed || 1;
    if (curEl) curEl.textContent = fmt((curMs / 1000) / speed);
    // À direita fica o que FALTA — é o que responde "dá tempo de terminar?".
    // Sem duração conhecida NÃO se escreve "-0:00": zero restante num livro
    // que mal começou é informação errada. Melhor não dizer nada.
    const falta = totMs - curMs;
    if (totEl) totEl.textContent = (totMs > 0 && isFinite(falta) && falta > 500)
        ? '-' + fmt((falta / 1000) / speed) : '';
}

function fracDoPonteiro(e) {
    const b = document.getElementById('pBar');
    if (!b) return 0;
    const r = b.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
}

function iniciarArrasto(e) {
    if (!getDocTotalMs()) return;
    const b = document.getElementById('pBar');
    arrastandoTrilha = true;
    b.classList.add('dragging');
    try { b.setPointerCapture(e.pointerId); } catch {}  // ponteiro sintetico nao captura
    const f = fracDoPonteiro(e);
    pintarTrilha(f, f * getDocTotalMs(), getDocTotalMs());
    resetPlayerIdle();
}

function moverArrasto(e) {
    if (!arrastandoTrilha) return;
    const f = fracDoPonteiro(e);
    pintarTrilha(f, f * getDocTotalMs(), getDocTotalMs());
}

async function soltarArrasto(e) {
    if (!arrastandoTrilha) return;
    const b = document.getElementById('pBar');
    arrastandoTrilha = false;
    b.classList.remove('dragging');
    try { b.releasePointerCapture(e.pointerId); } catch {}
    await seekToFrac(fracDoPonteiro(e));
}

// Estado salvo do player (recolhido/expandido) vale desde o primeiro quadro
(function estadoInicialDoPlayer() {
    aplicarEstadoPlayer(settings.playerRecolhido === true, false);
    updatePlayButton();
})();

(function ligarTrilha() {
    const b = document.getElementById('pBar');
    if (!b) return;
    b.addEventListener('pointerdown', iniciarArrasto);
    b.addEventListener('pointermove', moverArrasto);
    b.addEventListener('pointerup', soltarArrasto);
    b.addEventListener('pointercancel', () => { arrastandoTrilha = false; b.classList.remove('dragging'); });
    b.addEventListener('keydown', (e) => {
        const tot = getDocTotalMs();
        if (!tot) return;
        const passo = 10000 / tot; // 10 s
        if (e.key === 'ArrowRight') { e.preventDefault(); seekToFrac(getDocCurrentMs() / tot + passo); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); seekToFrac(getDocCurrentMs() / tot - passo); }
    });
})();

// Compat: o clique simples continua valendo (e é o que o teste antigo usa)
async function seekAudio(e) { await seekToFrac(fracDoPonteiro(e)); }

async function seekToFrac(frac) {
    const totMs = getDocTotalMs();
    if (!totMs) return;
    const targetMs = Math.max(0, Math.min(1, frac)) * totMs;
    // Achar qual chunk contém targetMs
    let acc = 0, targetChunk = 0, localMs = 0;
    for (let i = 0; i < currentChunks.length; i++) {
        const dur = chunkDurations[i] || AVG_CHUNK_MS;
        if (acc + dur >= targetMs) { targetChunk = i; localMs = targetMs - acc; break; }
        acc += dur;
    }
    if (targetChunk === currentChunkIndex && audio.duration && isFinite(audio.duration)) {
        audio.currentTime = Math.min(localMs / 1000, audio.duration - 0.1);
    } else {
        currentChunkIndex = targetChunk;
        updateUI();
        await playCurrentChunk();
        if (audio.duration && isFinite(audio.duration)) {
            audio.currentTime = Math.min(localMs / 1000, audio.duration - 0.1);
        }
    }
}
function setSpeed(s) {
    currentSpeed = s;
    audio.playbackRate = s;
    const b = document.getElementById('speedBtn');
    // "1×" e não "1.0×": o rótulo tem de caber e ser lido de relance
    if (b) b.textContent = (Number.isInteger(s) ? s : s) + '×';
    refreshPlayerTime();
}

// === FOLHA DE ESCOLHA (voz e velocidade) ===
// Mesmo papel da sheet do app: nenhum <select> nativo, que desenharia com o
// chrome do sistema e destoaria da fonte da casa.
const VELOCIDADES = [0.5, 0.75, 1, 1.25, 1.5, 2];
let folhaAberta = null;

async function abrirFolha(tipo) {
    const fundo = document.getElementById('ppSheet');
    const titulo = document.getElementById('ppSheetTitle');
    const lista = document.getElementById('ppSheetItems');
    if (!fundo || !lista) return;

    if (tipo === 'voz' && !voiceList.length) await loadVoices();

    const itens = tipo === 'voz'
        ? voiceList.map(v => ({
            valor: v.name,
            rotulo: v.label || rotuloDaVoz(v.name),
            sub: v.gender || '',
            ativo: v.name === selectedVoice,
        }))
        : VELOCIDADES.map(v => ({
            valor: v,
            rotulo: v + '×',
            sub: v === 1 ? 'normal' : '',
            ativo: v === currentSpeed,
        }));

    titulo.textContent = tipo === 'voz' ? 'Voz' : 'Velocidade';
    lista.innerHTML = itens.map(i => `
        <button class="pp-sheet-item${i.ativo ? ' active' : ''}" role="option" aria-selected="${i.ativo}"
                onclick="escolherNaFolha('${tipo}', ${typeof i.valor === 'string' ? `'${i.valor}'` : i.valor})">
            <span>${i.rotulo}${i.sub ? ` <span class="sub">${i.sub}</span>` : ''}</span>
            ${i.ativo ? '<span class="check">✓</span>' : ''}
        </button>`).join('');

    fundo.classList.add('open');
    folhaAberta = tipo;
    document.getElementById(tipo === 'voz' ? 'voiceBtn' : 'speedBtn')?.setAttribute('aria-expanded', 'true');
    resetPlayerIdle();
}

function fecharFolha(e) {
    if (e && e.target && e.target.id !== 'ppSheet') return;
    document.getElementById('ppSheet')?.classList.remove('open');
    document.getElementById('voiceBtn')?.setAttribute('aria-expanded', 'false');
    document.getElementById('speedBtn')?.setAttribute('aria-expanded', 'false');
    folhaAberta = null;
    resetPlayerIdle();
}

async function escolherNaFolha(tipo, valor) {
    fecharFolha();
    if (tipo === 'velocidade') { setSpeed(valor); return; }
    await aplicarVoz(valor);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && folhaAberta) fecharFolha(); });
window.abrirFolha = abrirFolha;
window.fecharFolha = fecharFolha;
window.escolherNaFolha = escolherNaFolha;

function skipBack() { if(audio.src) audio.currentTime = Math.max(0, audio.currentTime - 10); }
function skipForward() { if(audio.src) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); }

let voiceList = [], voiceIdx = 0, selectedVoice = 'pt-BR-AntonioNeural';

// Troca a voz DURANTE a leitura: a pílula fica ao lado da velocidade, que é
// onde a mão já está, e abre a mesma folha. O ciclo continua existindo para
// quem chamar por código.
async function cycleVoice() {
    if (!voiceList.length) await loadVoices();
    if (!voiceList.length) return;
    await aplicarVoz(voiceList[(voiceIdx + 1) % voiceList.length].name);
}

async function aplicarVoz(nome) {
    if (!voiceList.length) await loadVoices();
    const i = voiceList.findIndex(v => v.name === nome);
    if (i < 0) return;
    voiceIdx = i;
    selectedVoice = nome;

    // 🚨 O trecho seguinte já estava baixado NA VOZ ANTIGA. Sem limpar,
    // continuaríamos ouvindo a voz de antes e pareceria que a troca falhou.
    prefetchCache = {};

    aplicaRotuloDaVoz();
    showToast('Voz: ' + rotuloDaVoz(selectedVoice));

    // Preferência é da conta, não do navegador: vale no app e após o logout.
    fetch('/api/voices/selected', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voice: selectedVoice }),
    }).catch(() => {});

    // Retoma o mesmo trecho na voz nova, guardando o ponto da leitura.
    if (audio.src) {
        const fracao = audio.duration ? (audio.currentTime / audio.duration) : 0;
        const estavaTocando = isPlaying;
        await playCurrentChunk(fracao);
        if (!estavaTocando) pauseAudio();
    }
}

function rotuloDaVoz(nome) {
    const v = voiceList.find(x => x.name === nome);
    return v ? (v.label || v.name) : nome.replace('pt-BR-', '').replace('Neural', '');
}

function aplicaRotuloDaVoz() {
    const vn = document.getElementById('voiceName');
    if (vn) vn.textContent = rotuloDaVoz(selectedVoice);
}

function updateChapterDisplay() {
    const el = document.getElementById('ppChapterText');
    if (!el || !currentChunks.length) return;
    const chunk = currentChunks[currentChunkIndex];
    if (!chunk) return;
    const page = chunk.page;
    // Estilo Speechify: só nome do capítulo (ou "pág X" se sem TOC)
    let chapterName = null;
    if (tocData.length) {
        for (let i = tocData.length - 1; i >= 0; i--) {
            if (tocData[i].page <= page) { chapterName = tocData[i].title; break; }
        }
    }
    el.textContent = chapterName || `Página ${page}`;
}

async function nextChunk() { if(currentChunkIndex<currentChunks.length-1){currentChunkIndex++;updateUI();if(isPlaying) await playCurrentChunk();} }
async function prevChunk() { if(currentChunkIndex>0){currentChunkIndex--;updateUI();if(isPlaying) await playCurrentChunk();} }
async function goToChunk(i) { currentChunkIndex=i; updateUI(); await playCurrentChunk(); }

function updateUI() {
    updateChapterDisplay();
    refreshPlayerTime();
    loadChunkText(currentChunkIndex);
    if (currentChunks[currentChunkIndex]) { scrollPdfToPage(currentChunks[currentChunkIndex].page); }
}

function fmt(s) {
    if (!isFinite(s) || isNaN(s)) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return h > 0 ? `${h}:${m.toString().padStart(2,'0')}:${sec}` : `${m}:${sec}`;
}

let currentHighlightPage = 0;

async function loadPageWords(pageNum) {
    if (pageWordPositions[pageNum]) return pageWordPositions[pageNum];

        const r = await fetch(`/api/documents/${currentDoc.id}/pages/${pageNum}/words`);

// Highlight sequencial no PDF — usa indice do boundary para evitar duplicatas
let pdfHighlightWordCounter = 0; // conta quantas palavras ja foram faladas nesta sessao

// Build round-rect sub-path (viewBox 0-1000)
function _roundRectPath(x0, y0, x1, y1, r) {
    const w = x1 - x0, h = y1 - y0;
    const rr = Math.min(r, w / 2, h / 2);
    return `M ${x0+rr},${y0} L ${x1-rr},${y0} Q ${x1},${y0},${x1},${y0+rr} L ${x1},${y1-rr} Q ${x1},${y1},${x1-rr},${y1} L ${x0+rr},${y1} Q ${x0},${y1},${x0},${y1-rr} L ${x0},${y0+rr} Q ${x0},${y0},${x0+rr},${y0} Z`;
}

// Agrupa palavras consecutivas em LINHAS (mesma y0 com tolerância)
function _groupLines(words, fromIdx, toIdx) {
    const Y_TOL = 0.006;
    const lines = [];
    for (let i = fromIdx; i <= toIdx; i++) {
        const w = words[i];
        if (!w) continue;
        const last = lines[lines.length - 1];
        const yMid = (w.y0 + w.y1) / 2;
        if (last && Math.abs(yMid - last.yMid) < Y_TOL) {
            last.x0 = Math.min(last.x0, w.x0);
            last.x1 = Math.max(last.x1, w.x1);
            last.y0 = Math.min(last.y0, w.y0);
            last.y1 = Math.max(last.y1, w.y1);
        } else {
            lines.push({ x0: w.x0, y0: w.y0, x1: w.x1, y1: w.y1, yMid });
        }
    }
    return lines;
}

function _buildD(rects, padX, padY, radius) {
    if (!rects.length) return '';
    return rects.map(r => _roundRectPath(
        (r.x0 - padX) * 1000,
        (r.y0 - padY) * 1000,
        (r.x1 + padX) * 1000,
        (r.y1 + padY) * 1000,
        radius
    )).join(' ');
}

// ===== HOVER HIGHLIGHT (cinza, antes do play) =====
let _hoverState = { page: -1, sentStart: -1, sentEnd: -1 };

function clearHoverHighlight(pageNum) {
    const pageEl = document.getElementById(`pdf-page-${pageNum}`);
    if (!pageEl) return;
    const hoverPath = pageEl.querySelector('.pdf-hl-hover');
    if (hoverPath) hoverPath.setAttribute('d', '');
    _hoverState = { page: -1, sentStart: -1, sentEnd: -1 };
}

async function paintHoverSentence(pageNum, hoveredSpan, textLayerDiv) {
    const pageEl = document.getElementById(`pdf-page-${pageNum}`);
    if (!pageEl) return;
    const hoverPath = pageEl.querySelector('.pdf-hl-hover');
    if (!hoverPath) return;

    // Pegar word positions da página (já cacheado via loadPageWords)
    let words = pageWordPositions[pageNum];
    if (!words) { words = await loadPageWords(pageNum); }
    if (!words || !words.length) return;

    // Achar a palavra hovered no array `words`: usar texto do span + posição relativa
    const hoveredText = (hoveredSpan.dataset.text || '').toLowerCase().trim();
    if (!hoveredText) return;

    // Posição relativa do span no PDF (0-1)
    const layerRect = textLayerDiv.getBoundingClientRect();
    const spanRect = hoveredSpan.getBoundingClientRect();
    const xMid = (spanRect.left + spanRect.right) / 2 - layerRect.left;
    const yMid = (spanRect.top + spanRect.bottom) / 2 - layerRect.top;
    const relX = xMid / layerRect.width;
    const relY = yMid / layerRect.height;

    // Achar palavra mais próxima por proximidade espacial
    let bestIdx = -1, bestDist = Infinity;
    for (let i = 0; i < words.length; i++) {
        const w = words[i];
        const wxm = (w.x0 + w.x1) / 2, wym = (w.y0 + w.y1) / 2;
        const dx = wxm - relX, dy = (wym - relY) * 2; // pesa Y mais (linhas)
        const dist = dx*dx + dy*dy;
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
    if (bestIdx < 0) return;

    // Limites da frase
    const STOP = /[.!?;]$/;
    let sentStart = bestIdx, sentEnd = bestIdx;
    for (let i = bestIdx - 1; i >= 0; i--) {
        if (STOP.test(words[i].word)) break;
        sentStart = i;
    }
    for (let i = bestIdx; i < words.length; i++) {
        sentEnd = i;
        if (STOP.test(words[i].word)) break;
    }

    // Evitar re-renderizar se a frase é a mesma
    if (_hoverState.page === pageNum && _hoverState.sentStart === sentStart && _hoverState.sentEnd === sentEnd) return;
    _hoverState = { page: pageNum, sentStart, sentEnd };

    const lines = _groupLines(words, sentStart, sentEnd);
    hoverPath.setAttribute('d', _buildD(lines, 0.003, 0.002, 8));
}

function highlightWordOnPdf(boundaryIdx, pageNum) {
    const pageEl = document.getElementById(`pdf-page-${pageNum}`);
    if (!pageEl) return;
    const sentencePath = pageEl.querySelector('.pdf-hl-sentence');
    const wordPath = pageEl.querySelector('.pdf-hl-word');
    if (!sentencePath || !wordPath) return;

    const words = pageWordPositions[pageNum];
    if (!words || !words.length) {
        sentencePath.setAttribute('d', '');
        wordPath.setAttribute('d', '');
        return;
    }

    // Localizar palavra ativa na página por sequência (mais robusto que ratio puro)
    const norm = (s) => (s || '').toLowerCase().replace(/[.,;:!?"'()\[\] ]/g, '').trim();
    const bText = norm(wordBoundaries[boundaryIdx]?.text);
    const ratio = wordBoundaries.length > 0 ? boundaryIdx / wordBoundaries.length : 0;
    const targetWordIdx = Math.min(Math.floor(ratio * words.length), words.length - 1);

    // Ampliar raio de busca para chunks com muitas palavras
    const RADIUS = Math.max(20, Math.floor(words.length * 0.15));
    let bestIdx = targetWordIdx, bestDist = Infinity;
    for (let i = Math.max(0, targetWordIdx - RADIUS); i < Math.min(words.length, targetWordIdx + RADIUS); i++) {
        const wText = norm(words[i].word);
        if (!wText || !bText) continue;
        if (wText === bText || (bText.length >= 3 && (wText.startsWith(bText) || bText.startsWith(wText)))) {
            const dist = Math.abs(i - targetWordIdx);
            if (dist < bestDist) { bestDist = dist; bestIdx = i; }
        }
    }
    if (!words[bestIdx]) return;

    // Limites da frase (parada em pontuação forte: . ! ? ;)
    const STOP = /[.!?;]$/;
    let sentStart = bestIdx, sentEnd = bestIdx;
    for (let i = bestIdx - 1; i >= 0; i--) {
        if (STOP.test(words[i].word)) break;
        sentStart = i;
    }
    for (let i = bestIdx; i < words.length; i++) {
        sentEnd = i;
        if (STOP.test(words[i].word)) break;
    }

    // Path da FRASE: agrupado por linha em sub-paths round-rect
    const sentenceLines = _groupLines(words, sentStart, sentEnd);
    sentencePath.setAttribute('d', _buildD(sentenceLines, 0.003, 0.002, 8));

    // Palavra atual desligada — boundary do TTS desincroniza visualmente
    wordPath.setAttribute('d', '');
}

let lastPdfHighlightIdx = -1;
function updatePdfHighlight() {
    if (!wordBoundaries.length || currentView !== 'pdf' || !settings.highlight) return;
    const ms = audio.currentTime * 1000;
    let activeBIdx = -1;
    for (let i = 0; i < wordBoundaries.length; i++) {
        const b = wordBoundaries[i];
        if (ms >= b.offset_ms && ms < b.offset_ms + b.duration_ms + 300) { activeBIdx = i; break; }
    }
    if (activeBIdx >= 0 && activeBIdx !== lastPdfHighlightIdx) {
        lastPdfHighlightIdx = activeBIdx;
        const chunk = currentChunks[currentChunkIndex];
        if (chunk) {
            // Garantir que word positions estao carregadas
            if (pageWordPositions[chunk.page]) {
                highlightWordOnPdf(activeBIdx, chunk.page);
            } else {
                loadPageWords(chunk.page).then(() => highlightWordOnPdf(activeBIdx, chunk.page));
            }
        }
    }
}

// === CLICK-TO-READ NO PDF ===

const clean = (s) => s.toLowerCase().replace(/[.,;:!?"'()\[\]\-]/g, '').trim();

// Encontra o chunk mais proximo de uma pagina (fallback)
function findChunkForPage(pageNum) {
    let best = -1;
    for (let i = 0; i < currentChunks.length; i++) {
        if (currentChunks[i].page <= pageNum) best = i;
    }
    return best >= 0 ? best : 0;
}

// Cache de texto completo dos chunks (para busca precisa)
let chunkTextCache = {};

async function getChunkFullText(chunkIdx) {
    if (chunkTextCache[chunkIdx]) return chunkTextCache[chunkIdx];
    try {
        const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${chunkIdx}/text`);
        const d = await r.json();
        chunkTextCache[chunkIdx] = d.text;
        return d.text;
    } catch { return ''; }
}

// Normaliza texto para comparacao: lowercase, sem pontuacao, whitespace unificado
function normalize(s) {
    return s.toLowerCase().replace(/[.,;:!?"'()\[\]\-\u2014\u2013\u201C\u201D\u2018\u2019]/g, '').replace(/\s+/g, ' ').trim();
}

// Busca o texto clicado em TODOS os chunks da pagina para encontrar o chunk correto
async function findCorrectChunk(pageNum, clickedWords) {
    // IMPORTANTE: manter TODAS as palavras (inclusive "a", "e", "o")
    // porque elas estao no texto normalizado do chunk
    const searchWords = clickedWords.map(w => w.toLowerCase().trim()).filter(w => w);
    if (searchWords.length < 2) return findChunkForPage(pageNum);

    // Frases de busca: completa (8 palavras) e curta (4 palavras)
    const fullPhrase = searchWords.slice(0, 8).join(' ');
    const shortPhrase = searchWords.slice(0, 4).join(' ');

    // Pegar TODOS os chunks que podem estar nesta pagina
    const candidates = [];
    for (let i = 0; i < currentChunks.length; i++) {
        const cp = currentChunks[i].page;
        if (cp >= pageNum - 1 && cp <= pageNum + 1) candidates.push(i);
    }
    if (!candidates.length) return findChunkForPage(pageNum);

    // Buscar a frase em cada chunk candidato (texto normalizado!)
    for (const ci of candidates) {
        const text = await getChunkFullText(ci);
        const textNorm = normalize(text);

        if (textNorm.includes(fullPhrase)) return ci;
        if (shortPhrase.length > 4 && textNorm.includes(shortPhrase)) return ci;
    }

    // Fallback
    return findChunkForPage(pageNum);
}

// Encontra boundary por sequencia de palavras (sliding window nos boundaries)
// Este e o metodo principal — busca as palavras clicadas direto nos boundaries do TTS
function findBoundaryByWordSequence(clickedWords) {
    if (!wordBoundaries.length) return -1;

    // Manter TODAS as palavras (inclusive curtas como "a", "e", "o")
    const context = clickedWords.map(w => clean(w)).filter(w => w).slice(0, 10);
    if (context.length < 1) return -1;

    let bestScore = 0, bestIdx = -1;
    for (let bi = 0; bi < wordBoundaries.length; bi++) {
        let score = 0;
        let bOffset = 0;
        for (let ci = 0; ci < context.length && bi + bOffset < wordBoundaries.length; ci++) {
            const bt = clean(wordBoundaries[bi + bOffset].text);
            if (bt === context[ci]) { score += 3; bOffset++; }
            else if (bt.startsWith(context[ci]) || context[ci].startsWith(bt)) { score += 1; bOffset++; }
            else {
                // TTS pode pular palavras curtas — tentar proximo boundary
                if (bi + bOffset + 1 < wordBoundaries.length) {
                    const bt2 = clean(wordBoundaries[bi + bOffset + 1].text);
                    if (bt2 === context[ci]) { score += 2; bOffset += 2; }
                    else bOffset++;
                } else bOffset++;
            }
        }
        if (score > bestScore) { bestScore = score; bestIdx = bi; }
    }

    return bestIdx;
}

// Espera audio carregar metadados para poder fazer seek
function waitForAudioReady() {
    return new Promise(resolve => {
        if (audio.readyState >= 2) return resolve();
        const onReady = () => { audio.removeEventListener('canplay', onReady); resolve(); };
        audio.addEventListener('canplay', onReady);
        setTimeout(resolve, 3000);
    });
}

// Click handler genérico em .pdf-page (mobile/fallback) — sem text layer
// Usa coordenadas do click e pageWordPositions
function attachPageClickHandlers() {
    const pv = document.getElementById('pdfView');
    if (!pv) return;
    pv.addEventListener('click', async (e) => {
        if (!settings.clickToListen) return;
        const pageEl = e.target.closest('.pdf-page');
        if (!pageEl) return;
        const pageNum = parseInt(pageEl.dataset.page);
        if (!pageNum) return;
        const rect = pageEl.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;
        await handlePageClick(pageNum, relX, relY);
    }, { passive: true });
}

// Lógica unificada de click — recebe coords relativas (0-1) na página
async function handlePageClick(pageNum, relX, relY) {
    showPlayLoading(true);
    lastPdfHighlightIdx = -1;

    try {
        const pageWords = await loadPageWords(pageNum);
        if (!pageWords || !pageWords.length) { showPlayLoading(false); return; }

        let clickIdx = 0, bestDist = Infinity;
        for (let i = 0; i < pageWords.length; i++) {
            const w = pageWords[i];
            const wxm = (w.x0 + w.x1) / 2, wym = (w.y0 + w.y1) / 2;
            const dx = wxm - relX, dy = (wym - relY) * 2;
            const dist = dx*dx + dy*dy;
            if (dist < bestDist) { bestDist = dist; clickIdx = i; }
        }

        let sentStartIdx = clickIdx;
        for (let i = clickIdx - 1; i >= 0; i--) {
            if (/[.!?]$/.test(pageWords[i].word)) { sentStartIdx = i + 1; break; }
            sentStartIdx = i;
        }

        const contextWords = pageWords.slice(sentStartIdx, sentStartIdx + 12).map(w => w.word);
        const chunkIdx = await findCorrectChunk(pageNum, contextWords);
        currentChunkIndex = chunkIdx;

        let data;
        if (prefetchCache[currentChunkIndex]) { data = prefetchCache[currentChunkIndex]; delete prefetchCache[currentChunkIndex]; }
        else { const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${currentChunkIndex}/audio?voice=${encodeURIComponent(selectedVoice)}`, {method:'POST'}); data = await r.json(); }

        wordBoundaries = data.boundaries || [];
        _sentenceRanges = [];
        if (data.text) renderTextWithWords(data.text);
        await new Promise(r => requestAnimationFrame(r));
        buildBoundaryMap();

        let seekTimeSec = 0;
        if (wordBoundaries.length > 0) {
            const bIdx = findBoundaryByWordSequence(contextWords);
            if (bIdx >= 0 && wordBoundaries[bIdx]) {
                seekTimeSec = wordBoundaries[bIdx].offset_ms / 1000;
            }
        }

        audio.src = data.audio_url;
        audio.playbackRate = currentSpeed;
        await waitForAudioReady();

        if (seekTimeSec > 0.1) {
            audio.currentTime = seekTimeSec;
            await new Promise(resolve => {
                const onSeeked = () => { audio.removeEventListener('seeked', onSeeked); resolve(); };
                audio.addEventListener('seeked', onSeeked);
                setTimeout(resolve, 2000);
            });
        }

        await audio.play();
        isPlaying = true;
        showPlayLoading(false);
        updatePlayButton();
        updateChapterDisplay();
        startHighlightLoop();
        resetPlayerIdle();
        prefetchAhead(currentChunkIndex);
    } catch(e) {
        console.error('[click] erro:', e);
        showPlayLoading(false);
        showToast(e.message || 'Erro ao iniciar leitura');
    }
}

// Click handler — usa pageWordPositions (ordem de leitura confiável do PyMuPDF)
async function handleTextLayerClick(pageNum, clickedSpan, textLayerDiv) {
    if (!settings.clickToListen) return;

    // 1) Pegar coordenadas relativas (0-1) do clique no PDF
    const layerRect = textLayerDiv.getBoundingClientRect();
    const spanRect = clickedSpan.getBoundingClientRect();
    const relX = ((spanRect.left + spanRect.right) / 2 - layerRect.left) / layerRect.width;
    const relY = ((spanRect.top + spanRect.bottom) / 2 - layerRect.top) / layerRect.height;

    showPlayLoading(true);
    lastPdfHighlightIdx = -1;

    try {
        // 2) Carregar palavras da página em ORDEM DE LEITURA (PyMuPDF)
        const pageWords = await loadPageWords(pageNum);
        if (!pageWords || !pageWords.length) {
            console.warn('[click] sem pageWordPositions para página', pageNum);
            showPlayLoading(false);
            return;
        }

        // 3) Achar palavra clicada por proximidade espacial
        let clickIdx = 0, bestDist = Infinity;
        for (let i = 0; i < pageWords.length; i++) {
            const w = pageWords[i];
            const wxm = (w.x0 + w.x1) / 2, wym = (w.y0 + w.y1) / 2;
            const dx = wxm - relX, dy = (wym - relY) * 2; // pesa Y mais
            const dist = dx*dx + dy*dy;
            if (dist < bestDist) { bestDist = dist; clickIdx = i; }
        }

        // 4) Walkback até início da FRASE (palavra anterior termina com .!?)
        let sentStartIdx = clickIdx;
        for (let i = clickIdx - 1; i >= 0; i--) {
            if (/[.!?]$/.test(pageWords[i].word)) { sentStartIdx = i + 1; break; }
            sentStartIdx = i;
        }

        // 5) Contexto = N palavras a partir do início da frase (ordem de leitura)
        const contextWords = pageWords.slice(sentStartIdx, sentStartIdx + 12).map(w => w.word);
        const contextText = contextWords.join(' ');
        console.log('[click] start sentença:', contextText.slice(0, 80));

        // 6) Achar chunk que contém o contexto
        const chunkIdx = await findCorrectChunk(pageNum, contextWords);
        currentChunkIndex = chunkIdx;

        // 7) Obter áudio + boundaries
        let data;
        if (prefetchCache[currentChunkIndex]) { data = prefetchCache[currentChunkIndex]; delete prefetchCache[currentChunkIndex]; }
        else { const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${currentChunkIndex}/audio?voice=${encodeURIComponent(selectedVoice)}`, {method:'POST'}); data = await r.json(); }

        wordBoundaries = data.boundaries || [];
        _sentenceRanges = [];
        if (data.text) renderTextWithWords(data.text);
        await new Promise(r => requestAnimationFrame(r));
        buildBoundaryMap();

        // 8) Match direto no TEXTO dos boundaries do TTS (sequence match)
        // — bem mais confiável que contar palavras + indexar, porque Edge TTS
        // pode pular palavras curtas, juntar números, etc.
        let seekTimeSec = 0;
        if (wordBoundaries.length > 0) {
            const bIdx = findBoundaryByWordSequence(contextWords);
            if (bIdx >= 0 && wordBoundaries[bIdx]) {
                seekTimeSec = wordBoundaries[bIdx].offset_ms / 1000;
                console.log('[click] boundary idx', bIdx, '@', seekTimeSec.toFixed(2) + 's text:', wordBoundaries[bIdx].text);
            } else {
                console.warn('[click] sequência não encontrada nos boundaries');
            }
        }

        // PASSO 4: Load, seek, play
        audio.src = data.audio_url;
        audio.playbackRate = currentSpeed;
        await waitForAudioReady();

        if (seekTimeSec > 0.1) {
            audio.currentTime = seekTimeSec;
            // Esperar seek completar
            await new Promise(resolve => {
                const onSeeked = () => { audio.removeEventListener('seeked', onSeeked); resolve(); };
                audio.addEventListener('seeked', onSeeked);
                setTimeout(resolve, 2000);
            });
        }

        await audio.play();
        isPlaying = true;
        showPlayLoading(false);
        updatePlayButton();
        updateChapterDisplay();
        startHighlightLoop();
        resetPlayerIdle();
        prefetchAhead(currentChunkIndex);

    } catch(e) { showPlayLoading(false); showToast(e.message); }
}

// === VOZES ===
async function loadVoices() {
    try {
        const r = await fetch('/api/voices?language=pt-BR');
        const d = await r.json();
        voiceList = d.voices || [];
        if (d.selected) selectedVoice = d.selected;
        const i = voiceList.findIndex(v => v.name === selectedVoice);
        if (i >= 0) voiceIdx = i;
        aplicaRotuloDaVoz();
    } catch {}
}

// === PRE-GERAR CHUNKS em background ===
async function prefetchChunks(startIdx, count) {
    for (let i = startIdx; i < Math.min(startIdx + count, currentChunks.length); i++) {
        if (prefetchCache[i]) continue;
        try {
            const r = await fetch(`/api/documents/${currentDoc.id}/chunks/${i}/audio?voice=${encodeURIComponent(selectedVoice)}`, {method:'POST'});
            const d = await r.json();
            if (d.audio_url) prefetchCache[i] = d;
        } catch {}
    }
}
